# ── H2 in-memory database ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:smishguard;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create tables from entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Spring Security for the H2 console (no password popup)
spring.h2.console.settings.web-allow-others=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# CORS – allow local frontend on any common dev port
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# API keys (optional – empty = features disabled)
app.gemini-api-key=${GEMINI_API_KEY:}
app.safe-browsing-api-key=${SAFE_BROWSING_API_KEY:}

# Admin key for /api/reports
app.admin-key=${ADMIN_KEY:dev-admin-key}

# Rate limit per IP (requests per minute)
app.rate-limit=30
