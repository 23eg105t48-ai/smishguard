version: '3.9'
services:
  # Optional local PostgreSQL – use instead of H2 for testing prod-like setup
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smishguard
      POSTGRES_USER: smishguard
      POSTGRES_PASSWORD: smishguard_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/smishguard
      DB_USERNAME: smishguard
      DB_PASSWORD: smishguard_local
      ALLOWED_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
      ADMIN_KEY: ${ADMIN_KEY:-local-admin}
    depends_on:
      - db

volumes:
  pgdata:
